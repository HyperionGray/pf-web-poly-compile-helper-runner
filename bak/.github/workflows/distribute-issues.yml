name: Distribute Issues

on:
  workflow_dispatch:
    inputs:
      issue_file:
        description: 'Path to issue file (JSON/JSONL)'
        required: false
        default: '.github/issues_batch.json'
      all_accounts:
        description: 'Distribute to all accounts (P4X-ng, HyperionGray, TeamHG-Memex)'
        required: false
        default: true
        type: boolean
      dry_run:
        description: 'Dry Run (check without creating)'
        required: false
        default: false
        type: boolean

jobs:
  distribute:
    runs-on: [self-hosted, linux, x64, big]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Distribute Issues
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          FILE_PATH="${{ inputs.issue_file }}"
          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          if [ ! -f "$FILE_PATH" ]; then
            echo "❌ File $FILE_PATH not found in repository."
            exit 1
          fi

          TARGET_FLAG=""
          if [ "${{ inputs.all_accounts }}" = "true" ]; then
            TARGET_FLAG="--all-accounts"
          else
            TARGET_FLAG="--owner P4X-ng"
          fi

          echo "🚀 Running distribute_issues.py..."
          python distribute_issues.py --file "$FILE_PATH" $TARGET_FLAG $DRY_RUN_FLAG
