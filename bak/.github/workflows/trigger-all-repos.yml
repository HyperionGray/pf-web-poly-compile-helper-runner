name: Trigger Workflow on All Repos

on:
  workflow_dispatch:
    inputs:
      workflow_file:
        description: 'Workflow file name to trigger (e.g., workflows-sync.yml)'
        required: true
        type: string
      all_accounts:
        description: 'Trigger on all accounts (P4X-ng, HyperionGray, TeamHG-Memex)'
        required: false
        default: true
        type: boolean
      ref:
        description: 'Git reference (branch/tag/SHA) to run workflow from'
        required: false
        default: 'main'
        type: string
      include_archived:
        description: 'Include archived repositories'
        required: false
        default: false
        type: boolean
      check_only:
        description: 'Only check which repos have the workflow (do not trigger)'
        required: false
        default: false
        type: boolean

jobs:
  trigger-all:
    runs-on: [self-hosted, linux, x64, big]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Trigger workflow on all repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ "${{ inputs.all_accounts }}" = "true" ]; then
            echo "Triggering on all accounts: P4X-ng, HyperionGray, TeamHG-Memex"
            python trigger_workflow_all_repos.py \
              "${{ inputs.workflow_file }}" \
              --all-accounts \
              --ref "${{ inputs.ref }}" \
              ${{ inputs.include_archived && '--include-archived' || '' }} \
              ${{ inputs.check_only && '--check-only' || '' }} \
              --delay 1.5
          else
            echo "Triggering on P4X-ng only"
            python trigger_workflow_all_repos.py \
              P4X-ng \
              "${{ inputs.workflow_file }}" \
              --ref "${{ inputs.ref }}" \
              ${{ inputs.include_archived && '--include-archived' || '' }} \
              ${{ inputs.check_only && '--check-only' || '' }} \
              --delay 1.5
          fi

      - name: Summary
        run: |
          echo "## Workflow Dispatch Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow:** ${{ inputs.workflow_file }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.all_accounts }}" = "true" ]; then
            echo "**Accounts:** P4X-ng, HyperionGray, TeamHG-Memex (all accounts)" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Accounts:** P4X-ng only" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Reference:** ${{ inputs.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "**Include archived:** ${{ inputs.include_archived }}" >> $GITHUB_STEP_SUMMARY
          echo "**Check only:** ${{ inputs.check_only }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See logs above for detailed results." >> $GITHUB_STEP_SUMMARY
