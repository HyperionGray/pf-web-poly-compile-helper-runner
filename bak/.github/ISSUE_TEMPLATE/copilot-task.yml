name: 🤖 Copilot Task
description: Request Copilot assistance for code analysis, generation, or review
title: "[COPILOT] "
labels: ["copilot"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🤖 Copilot Task Request
        
        Use this template to request GitHub Copilot assistance. The issue will be automatically assigned to Copilot based on your model selection.

  - type: dropdown
    id: copilot-model
    attributes:
      label: Copilot Model
      description: Select the Copilot model best suited for your task
      options:
        - copilot-gpt-5.1 (General purpose - default)
        - copilot-gpt-5.1-codex (Code generation & analysis)
        - copilot-claude-4.5-opus (Advanced reasoning & analysis)
      default: 0
    validations:
      required: true

  - type: dropdown
    id: task-type
    attributes:
      label: Task Type
      description: What type of assistance do you need?
      options:
        - Code Review
        - Code Generation
        - Bug Analysis
        - Documentation
        - Architecture Review
        - Testing
        - Refactoring
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Task Description
      description: Describe what you need Copilot to help with
      placeholder: |
        Please provide a clear description of the task:
        - What needs to be done?
        - What files or components are involved?
        - Any specific requirements or constraints?
        - Expected outcome
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any additional context, code snippets, or relevant information
      placeholder: |
        - Related files or directories
        - Code snippets
        - Error messages
        - Links to documentation
        - Previous attempts or solutions tried

  - type: checkboxes
    id: urgency
    attributes:
      label: Priority
      options:
        - label: High Priority (needs immediate attention)
        - label: Standard Priority
        - label: Low Priority (when time permits)

  - type: markdown
    attributes:
      value: |
        ---
        
        **Note:** This issue will be automatically assigned to GitHub Copilot based on your model selection. 
        The selected model will be applied via the `copilot-model:` label.