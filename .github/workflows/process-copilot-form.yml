name: Process Issue Forms

on:
  issues:
    types: [opened]

jobs:
  process-issue-forms:
    runs-on: [self-hosted, linux, x64, big]
    permissions:
      issues: write
      contents: read
    steps:
      - name: Process Copilot and Bug Report Forms
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueBody = context.payload.issue.body || '';
            const issueLabels = context.payload.issue.labels.map(label => label.name);
            console.log('Processing issue form...');
            console.log(`Current labels: ${issueLabels.join(', ')}`);

            let labelsToAdd = [];

            // Check if this is a Copilot task (already has copilot label)
            if (issueLabels.includes('copilot')) {
              console.log('Processing Copilot task form...');

              // Extract model selection from Copilot task form
              const modelRegex = /### Copilot Model\s*\n\s*([^\n]+)/i;
              const match = issueBody.match(modelRegex);

              if (match) {
                const selectedModel = match[1].trim();
                console.log(`Found model selection: ${selectedModel}`);

                // Map display names to label values
                const modelMap = {
                  'copilot-gpt-5.1 (General purpose - default)': 'copilot-gpt-5.1',
                  'copilot-gpt-5.1-codex (Code generation & analysis)': 'copilot-gpt-5.1-codex',
                  'copilot-claude-4.5-opus (Advanced reasoning & analysis)': 'copilot-claude-4.5-opus'
                };

                const modelLabel = modelMap[selectedModel];

                if (modelLabel) {
                  labelsToAdd.push(`copilot-model:${modelLabel}`);
                  console.log(`Will add model label: copilot-model:${modelLabel}`);
                } else {
                  console.log(`⚠️ Unknown model selection: ${selectedModel}`);
                }
              } else {
                console.log('ℹ️ No model selection found in Copilot form, will use default');
              }
            }

            // Check if this is a bug report requesting Copilot assistance
            if (issueLabels.includes('bug')) {
              console.log('Processing bug report form...');

              // Check if Copilot assistance was requested
              const copilotRequestRegex = /### Request Copilot Assistance\s*\n\s*- \[x\] Assign this issue to Copilot for analysis/i;
              const copilotRequested = copilotRequestRegex.test(issueBody);

              if (copilotRequested) {
                console.log('Copilot assistance requested for bug report');
                labelsToAdd.push('copilot');

                // Extract model selection from bug report
                const bugModelRegex = /### Copilot Model \(if requesting assistance\)\s*\n\s*([^\n]+)/i;
                const bugModelMatch = issueBody.match(bugModelRegex);

                if (bugModelMatch) {
                  const selectedModel = bugModelMatch[1].trim();
                  console.log(`Found bug report model selection: ${selectedModel}`);

                  // Map display names to label values for bug reports
                  const bugModelMap = {
                    'copilot-gpt-5.1 (General purpose)': 'copilot-gpt-5.1',
                    'copilot-gpt-5.1-codex (Code analysis)': 'copilot-gpt-5.1-codex',
                    'copilot-claude-4.5-opus (Deep analysis)': 'copilot-claude-4.5-opus'
                  };

                  const modelLabel = bugModelMap[selectedModel];

                  if (modelLabel) {
                    labelsToAdd.push(`copilot-model:${modelLabel}`);
                    console.log(`Will add bug report model label: copilot-model:${modelLabel}`);
                  } else {
                    console.log(`⚠️ Unknown bug report model selection: ${selectedModel}`);
                  }
                }
              } else {
                console.log('No Copilot assistance requested for bug report');
              }
            }

            // Add all collected labels
            if (labelsToAdd.length > 0) {
              console.log(`Adding labels: ${labelsToAdd.join(', ')}`);

              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  labels: labelsToAdd
                });
                console.log(`✅ Added labels: ${labelsToAdd.join(', ')}`);
              } catch (error) {
                console.log(`⚠️ Failed to add labels: ${error.message}`);
              }
            } else {
              console.log('ℹ️ No labels to add');
            }
