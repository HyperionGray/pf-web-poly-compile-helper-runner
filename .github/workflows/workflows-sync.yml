name: Workflows Sync

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'workflow-templates/**'
      - '.github/workflows/workflows-sync.yml'
      - 'sync_workflows.py'
  workflow_dispatch:
    inputs:
      all_accounts:
        description: 'Sync to all accounts (P4X-ng, HyperionGray, TeamHG-Memex, hyp3ri0n-ng)'
        required: false
        default: true
        type: boolean
      include_archived:
        description: 'Include archived repositories'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 6 * * *'  # sync daily at 6:00 UTC (syncs all accounts)

jobs:
  sync:
    runs-on: [self-hosted, linux, x64, big]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Sync workflow templates to all repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.all_accounts }}" = "true" ]; then
            echo "Syncing to all accounts: P4X-ng, HyperionGray, TeamHG-Memex, hyp3ri0n-ng"
            python sync_workflows.py --all-accounts \
              ${{ inputs.include_archived == true && '--include-archived' || '' }}
          else
            echo "Syncing to P4X-ng only"
            python sync_workflows.py P4X-ng \
              ${{ inputs.include_archived == true && '--include-archived' || '' }}
          fi
      
      - name: Summary
        if: always()
        run: |
          echo "## Workflow Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.all_accounts }}" = "true" ]; then
            echo "**Accounts:** P4X-ng, HyperionGray, TeamHG-Memex, hyp3ri0n-ng (all accounts)" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Accounts:** P4X-ng only" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Include archived:** ${{ inputs.include_archived }}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See logs above for detailed results." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Note:** The workflow succeeds as long as P4X-ng syncs successfully." >> $GITHUB_STEP_SUMMARY
          echo "> Failures in secondary accounts (HyperionGray, TeamHG-Memex, hyp3ri0n-ng) are expected" >> $GITHUB_STEP_SUMMARY
          echo "> if the token does not have access to those organizations." >> $GITHUB_STEP_SUMMARY
