name: HGActions Proxy Runner

# This workflow acts as a remote executor for local HGActions.
# It lives in a centralized 'proxy' repository.
# Local HGActions push code + instructions here to leverage GitHub infrastructure.

on:
  push:
    branches:
      - 'job-*' # Trigger on specific job branches
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Unique Job ID'
        required: true
      instruction:
        description: 'Task to perform (e.g. copilot-review)'
        required: true

jobs:
  proxy-executor:
    runs-on: [self-hosted, linux, x64, big]
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # Add other permissions as needed for your "Super Actions"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Instruction
        id: read_instruction
        run: |
          # If triggered by push, read from a file, else use input
          if [ -f ".hga/instruction.txt" ]; then
            INSTRUCTION=$(cat .hga/instruction.txt)
          else
            INSTRUCTION="${{ github.event.inputs.instruction }}"
          fi
          echo "Executing instruction: $INSTRUCTION"
          echo "task=$INSTRUCTION" >> $GITHUB_OUTPUT

      # --- CAPABILITY: COPILOT REVIEW ---
      - name: Copilot Review
        if: steps.read_instruction.outputs.task == 'copilot-review'
        run: |
          echo "Simulating Copilot Review..."
          # In a real setup, you'd call the Copilot API or use a specific action
          # For now, we simulate output
          echo "## Copilot Review Summary" > hga_result.md
          echo "- Code structure looks solid." >> hga_result.md
          echo "- Suggestion: Use list comprehensions in parser.py" >> hga_result.md

      # --- CAPABILITY: SECURITY SCAN ---
      - name: Security Scan
        if: steps.read_instruction.outputs.task == 'security-scan'
        run: |
          echo "Running Security Scan..."
          # Example: run CodeQL or similar
          echo "No critical vulnerabilities found." > hga_result.md

      # --- REPORTING ---
      - name: Report Result
        if: always()
        run: |
          # Commit the result back to the repo so the local client can pull it
          if [ -f hga_result.md ]; then
             git config user.name "HGActions Bot"
             git config user.email "bot@hgactions.local"
             git add hga_result.md
             git commit -m "Result for ${{ steps.read_instruction.outputs.task }}"
             git push
          fi
