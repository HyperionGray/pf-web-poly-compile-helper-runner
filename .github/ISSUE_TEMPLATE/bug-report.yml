name: Bug report

description: Create a report to help us improve

labels:
  - bug

title: "[BUG] "

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
    validations:
      required: true

  - type: textarea
    id: step-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: "1. Go to ....\n2. Click on ....\n3. Scroll down to ....\n4. See error"
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: Tell us what you expected to see!
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell

  - type: dropdown
    id: copilot_model
    attributes:
      label: Copilot model
      description: Choose the Copilot model to use for this work (if applicable).
      options:
        - gpt-5.2
        - gpt-5.2-pro
        - gpt-5.1
        - gpt-5.1-codex
      default: 0

  - type: checkboxes
    id: copilot_agent_acceptance_criteria
    attributes:
      label: Copilot agent acceptance criteria
      description: Required checklist for Copilot/agent-assisted work.
      options:
        - label: Follow .github/copilot-instructions.md
          required: true
        - label: Keep files under ~200-300 lines (split/refactor when needed)
          required: true
        - label: Use TypeScript for significant JavaScript changes
          required: true
        - label: Use Podman (not Docker)
          required: true
        - label: Add/update tests when relevant
          required: true
        - label: Update Pfyfile.pf when relevant
          required: true
        - label: Do final repo cleanup (formatting, linting, dead code, docs)
          required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
